on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
name: Security
jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
