on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
name: Security
jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
